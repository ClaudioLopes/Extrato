name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Extrato.sln
      - name: Build
        run: dotnet build Extrato.sln -c Release --no-restore
      - name: Testes (regras de cálculo e fluxos)
        run: dotnet test Extrato.sln -c Release --no-build --logger "trx;LogFileName=resultados.trx" --collect:"XPlat Code Coverage"
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: tests/**/TestResults/**

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      # sobe o compose (SQL Server + app) e confere páginas, modo offline, acesso e reinício
      - name: Imagem e smoke test do container
        run: bash scripts/smoke-docker.sh
