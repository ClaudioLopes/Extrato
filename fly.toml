# Fly.io: uma máquina com o app e o banco SQLite no volume (ADR 0005). Passo a passo em docs/deploy-fly.md.
# O nome do app é global no Fly: troque "extrato" se já existir (o endereço vira https://<nome>.fly.dev).
app = "extrato"
primary_region = "gru" # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  Extrato__FusoHorario = "America/Sao_Paulo"
  # o proxy do Fly termina o HTTPS: IP do cliente e https vêm de X-Forwarded-*
  Extrato__ProxyReverso = "true"
  # IA de visão: Gemini (plano grátis). Sem esta linha, o app usa o Claude se houver Claude__ApiKey.
  # Foto do corpo nunca vai ao Gemini grátis (o botão fica bloqueado).
  Visao__Provedor = "Gemini"
  # segredos (fly secrets set ou painel do Fly): Gemini__ApiKey (ou Claude__ApiKey); Auth__CodigoConfiguracao só no primeiro acesso

[mounts]
  source = "extrato_dados"
  destination = "/data" # banco SQLite (extrato.db) e chaves do cookie de sessão

[http_service]
  internal_port = 8080
  force_https = true
  # liga só quando usado: o proxy do Fly para a máquina sem acesso e a religa na próxima requisição
  # (alguns segundos; a tela abre do cache do PWA). O ajuste semanal roda na primeira vez que o app subir
  # a partir de segunda-feira (AgendaAjusteSemanal).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
